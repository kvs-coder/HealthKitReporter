name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=latest
  # Minimum library line coverage in percent. Only ever raise it, to the level the latest test PR reaches.
  COVERAGE_THRESHOLD: "69.4"

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  release-guard:
    name: Version / Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Top CHANGELOG.md entry matches the release manifest
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          header=$(grep -m1 '^## ' CHANGELOG.md)
          echo "manifest: $version, changelog: $header"
          [[ "$header" =~ ^"## [$version] - "[0-9]{2}\.[0-9]{2}\.[0-9]{4}\.$ ]] || {
            echo "::error file=CHANGELOG.md,line=1::Expected '## [$version] - dd.MM.yyyy.', got '$header'"
            exit 1
          }

  package:
    name: Package (iOS test, watchOS build)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Validate manifest
        run: swift package dump-package > /dev/null
      - name: Test (iOS)
        run: |
          xcodebuild test -scheme HealthKitReporter \
            -destination "$IOS_DESTINATION" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_REQUIRED=NO
      - name: Coverage gate
        run: |
          xcrun xccov view --report --only-targets TestResults.xcresult | tee coverage.txt
          coverage=$(xcrun xccov view --report --json TestResults.xcresult \
            | jq '.targets[] | select(.name == "HealthKitReporter") | .lineCoverage * 100')
          echo "library coverage: $coverage%, threshold: $COVERAGE_THRESHOLD%"
          awk -v c="$coverage" -v t="$COVERAGE_THRESHOLD" 'BEGIN { exit !(c >= t) }' || {
            echo "::error::Library line coverage $coverage% is below the $COVERAGE_THRESHOLD% threshold"
            exit 1
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            coverage.txt
          if-no-files-found: ignore
      - name: Build (watchOS)
        run: |
          xcodebuild build -scheme HealthKitReporter \
            -destination "generic/platform=watchOS Simulator" \
            CODE_SIGNING_REQUIRED=NO

  example:
    name: Example app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: |
          xcodebuild build -project Example/HealthKitReporter.xcodeproj \
            -scheme HealthKitReporter_Example \
            -destination "$IOS_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build (watch companion)
        run: |
          xcodebuild build -project Example/HealthKitReporter.xcodeproj \
            -scheme HealthKitReporterWatch \
            -destination "generic/platform=watchOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
